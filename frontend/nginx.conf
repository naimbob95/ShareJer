server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the Go server (the "api" service on the compose
    # network). Keeps the browser same-origin, so no CORS is needed.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Allow large uploads through the proxy (matches the app's own limit).
        client_max_body_size 25m;
    }

    # SPA fallback: any non-file route (e.g. /f/{id}) serves index.html so the
    # client-side router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
